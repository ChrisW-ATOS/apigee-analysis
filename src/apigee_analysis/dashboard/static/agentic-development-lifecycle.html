  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

13, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Libre Franklin';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"21e39ce0-b6ce-40a1-b29b-c2474b8cf078\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root{\n    --ink:#151A2D; --ink-2:#3E4763; --ink-3:#78829B;\n    --line:#E5E8F0; --bg:#FFFFFF; --panel:#F5F7FB; --panel-2:#EDF1FA;\n    --indigo:#3B5BDB; --indigo-ink:#25409C; --indigo-soft:#EEF2FE; --indigo-line:#CBD8FA;\n    --teal:#0E9384; --teal-ink:#0A6B60; --teal-soft:#E6F5F2; --teal-line:#B7E2DB;\n    --amber:#B9741A; --amber-soft:#FBF0DE; --amber-line:#EBD3AC;\n    --violet:#6A3FC4; --violet-ink:#4A2A93; --violet-soft:#F1ECFC; --violet-line:#D9CCF5;\n    --type-hero:96px; --type-title:58px; --type-subtitle:36px;\n    --type-lead:32px; --type-body:28px; --type-small:24px;\n    --pad-top:88px; --pad-bottom:78px; --pad-x:104px;\n  }\n  *{box-sizing:border-box;}\n  body{margin:0;}\n<\u002Fstyle>\n<\u002Fhelmet>\n<x-import component-from-global-scope=\"deck-stage\" from=\"1a5043e5-d3cc-4075-8a3c-a2b176f84911#/deck-stage.js\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\" data-uneditable=\"\">\n\n<!-- ═══ SLIDE 1 — TITLE ═══ -->\n<section data-label=\"Title\" data-screen-label=\"01 Title\" data-speaker-notes=\"One line: an agentic pipeline that plans, builds, tests and deploys software, then watches it run in production, predicts what will break, and fixes it before it does. The differentiator is closing the loop past deployment.\" style=\"box-sizing:border-box;width:100%;height:100%;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);background:var(--bg);color:var(--ink);font-family:'Libre Franklin',sans-serif;display:flex;flex-direction:column;justify-content:center;\">\n  <div style=\"height:5px;width:104px;background:var(--indigo);border-radius:3px;margin-bottom:40px;\"><\u002Fdiv>\n  <p style=\"margin:0 0 26px;font-size:26px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--indigo);\">Agentic Engineering<\u002Fp>\n  <h1 style=\"margin:0;font-family:'Archivo',sans-serif;font-weight:800;font-size:var(--type-hero);line-height:1.0;letter-spacing:-.025em;max-width:1500px;\">The End-to-End Agentic<br>Development Lifecycle<\u002Fh1>\n  <p style=\"margin:40px 0 0;font-size:var(--type-lead);line-height:1.42;color:var(--ink-2);max-width:1240px;font-weight:400;\">An agent pipeline that plans, builds, tests, and deploys software — then watches it run in production, predicts what will break, and fixes it before it does.<\u002Fp>\n  <div style=\"margin-top:56px;display:flex;align-items:center;gap:16px;\">\n    <span style=\"font-size:var(--type-small);color:var(--ink-3);font-weight:500;\">Plan<\u002Fspan>\n    <span style=\"font-size:var(--type-small);color:var(--indigo-line);\">›<\u002Fspan>\n    <span style=\"font-size:var(--type-small);color:var(--ink-3);font-weight:500;\">Build<\u002Fspan>\n    <span style=\"font-size:var(--type-small);color:var(--indigo-line);\">›<\u002Fspan>\n    <span style=\"font-size:var(--type-small);color:var(--ink-3);font-weight:500;\">Test<\u002Fspan>\n    <span style=\"font-size:var(--type-small);color:var(--indigo-line);\">›<\u002Fspan>\n    <span style=\"font-size:var(--type-small);color:var(--ink-3);font-weight:500;\">Deploy<\u002Fspan>\n    <span style=\"font-size:var(--type-small);color:var(--teal-line);\">›<\u002Fspan>\n    <span style=\"font-size:var(--type-small);color:var(--teal);font-weight:600;\">Monitor<\u002Fspan>\n    <span style=\"font-size:var(--type-small);color:var(--teal-line);\">›<\u002Fspan>\n    <span style=\"font-size:var(--type-small);color:var(--teal);font-weight:600;\">Predict<\u002Fspan>\n    <span style=\"font-size:var(--type-small);color:var(--teal-line);\">›<\u002Fspan>\n    <span style=\"font-size:var(--type-small);color:var(--teal);font-weight:600;\">Self-heal<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══ SLIDE 2 — THE PROBLEM ═══ -->\n<section data-label=\"The Problem\" data-screen-label=\"02 Problem\" data-speaker-notes=\"Today's SDLC is bottlenecked by sequential human handoffs and reactive monitoring. Root cause takes longer than the fix, and predictable issues still run the full human cycle.\" style=\"box-sizing:border-box;width:100%;height:100%;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);background:var(--bg);color:var(--ink);font-family:'Libre Franklin',sans-serif;display:flex;flex-direction:column;\">\n  <p style=\"margin:0 0 20px;font-size:26px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--indigo);\">The Problem<\u002Fp>\n  <h2 style=\"margin:0;font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);line-height:1.04;letter-spacing:-.02em;max-width:1360px;\">Today's lifecycle is sequential and reactive<\u002Fh2>\n  <div style=\"flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:26px;margin-top:52px;min-height:0;\">\n    <div style=\"border:1px solid var(--line);border-radius:16px;padding:34px 36px;display:flex;flex-direction:column;justify-content:center;background:var(--panel);\">\n      <p style=\"margin:0 0 12px;font-family:'Archivo';font-weight:700;font-size:var(--type-subtitle);color:var(--ink);\">Sequential handoffs<\u002Fp>\n      <p style=\"margin:0;font-size:var(--type-body);line-height:1.4;color:var(--ink-2);\">Plan, build, review, test, and deploy each wait on a person's calendar — not on readiness. Speed to market suffers.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid var(--line);border-radius:16px;padding:34px 36px;display:flex;flex-direction:column;justify-content:center;background:var(--panel);\">\n      <p style=\"margin:0 0 12px;font-family:'Archivo';font-weight:700;font-size:var(--type-subtitle);color:var(--ink);\">Reactive monitoring<\u002Fp>\n      <p style=\"margin:0;font-size:var(--type-body);line-height:1.4;color:var(--ink-2);\">Teams hear about incidents from alerts or customers — rarely before they happen.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid var(--line);border-radius:16px;padding:34px 36px;display:flex;flex-direction:column;justify-content:center;background:var(--panel);\">\n      <p style=\"margin:0 0 12px;font-family:'Archivo';font-weight:700;font-size:var(--type-subtitle);color:var(--ink);\">Slow root cause<\u002Fp>\n      <p style=\"margin:0;font-size:var(--type-body);line-height:1.4;color:var(--ink-2);\">Reconstructing which PR, deploy, or config changed often takes longer than the fix itself.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid var(--line);border-radius:16px;padding:34px 36px;display:flex;flex-direction:column;justify-content:center;background:var(--panel);\">\n      <p style=\"margin:0 0 12px;font-family:'Archivo';font-weight:700;font-size:var(--type-subtitle);color:var(--ink);\">Repetitive firefighting<\u002Fp>\n      <p style=\"margin:0;font-size:var(--type-body);line-height:1.4;color:var(--ink-2);\">Predictable issues — credential expiry, config drift, capacity limits — still run the full human cycle.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══ SLIDE 3 — CLOSING THE LOOP ═══ -->\n<section data-label=\"Closing the Loop\" data-screen-label=\"03 Closing the Loop\" data-speaker-notes=\"Most AI-in-SDLC narratives stop at code generation. This closes the loop: production telemetry feeds back into the same agents that built the feature. Because those agents did the planning, build and deploy, they retain the context needed to diagnose and fix fast.\" style=\"box-sizing:border-box;width:100%;height:100%;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);background:var(--bg);color:var(--ink);font-family:'Libre Franklin',sans-serif;display:flex;flex-direction:column;\">\n  <p style=\"margin:0 0 20px;font-size:26px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--indigo);\">The Core Idea<\u002Fp>\n  <h2 style=\"margin:0;font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);line-height:1.04;letter-spacing:-.02em;max-width:1400px;\">Closing the loop past deployment<\u002Fh2>\n  <div style=\"flex:1;display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:48px;min-height:0;\">\n    <div style=\"border:1px solid var(--line);border-radius:18px;padding:44px 44px;display:flex;flex-direction:column;background:var(--panel);\">\n      <p style=\"margin:0 0 20px;font-size:var(--type-small);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);\">Most AI in the SDLC<\u002Fp>\n      <p style=\"margin:0 0 18px;font-family:'Archivo';font-weight:700;font-size:40px;line-height:1.1;color:var(--ink);\">Stops at code generation<\u002Fp>\n      <p style=\"margin:auto 0 0;font-size:var(--type-body);line-height:1.45;color:var(--ink-2);\">A faster autocomplete that hands work back to a human at every gate. The loop still ends at the pull request.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1.5px solid var(--indigo);border-radius:18px;padding:44px 44px;display:flex;flex-direction:column;background:var(--indigo-soft);\">\n      <p style=\"margin:0 0 20px;font-size:var(--type-small);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--indigo);\">This architecture — AI native<\u002Fp>\n      <p style=\"margin:0 0 18px;font-family:'Archivo';font-weight:700;font-size:40px;line-height:1.1;color:var(--indigo-ink);\">Runs the loop in production<\u002Fp>\n      <p style=\"margin:auto 0 0;font-size:var(--type-body);line-height:1.45;color:var(--ink-2);\">The same agents keep watching after deploy — predicting failures and shipping fixes before customers notice.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:34px 0 0;font-size:var(--type-lead);line-height:1.4;color:var(--ink);font-weight:500;max-width:1560px;\">Because the agents already planned, built, and deployed the system, they retain the context needed to run it — no reverse-engineering the git log.<\u002Fp>\n<\u002Fsection>\n\n<!-- ═══ SLIDE — BUSINESS OUTCOMES ═══ -->\n<section data-label=\"Business Outcomes\" data-screen-label=\"04 Outcomes\" data-speaker-notes=\"For a leadership audience, this is what the architecture buys the business. Speed to market: features ship on readiness, not calendars. Operational efficiency: routine firefighting leaves the human queue. Value creation: engineering hours move from rework to new capability, funding future fit business models. Compliance: every agent decision is logged in a full audit trail. Together this is an AI native approach — not a bolt-on tool.\" style=\"box-sizing:border-box;width:100%;height:100%;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);background:var(--bg);color:var(--ink);font-family:'Libre Franklin',sans-serif;display:flex;flex-direction:column;\">\n  <p style=\"margin:0 0 20px;font-size:26px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--indigo);\">Why It Matters<\u002Fp>\n  <h2 style=\"margin:0;font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);line-height:1.04;letter-spacing:-.02em;max-width:1460px;\">An AI native approach, measured in business outcomes<\u002Fh2>\n  <div style=\"flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:24px;margin-top:46px;min-height:0;\">\n    <div style=\"border:1px solid var(--line);border-radius:16px;padding:32px 36px;display:flex;flex-direction:column;justify-content:center;background:var(--panel);\">\n      <p style=\"margin:0 0 10px;font-family:'Archivo';font-weight:700;font-size:var(--type-subtitle);color:var(--ink);\">Speed to market<\u002Fp>\n      <p style=\"margin:0;font-size:var(--type-body);line-height:1.4;color:var(--ink-2);\">Features move on readiness, not calendars — time to market compresses from weeks of handoffs to a continuous flow.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid var(--line);border-radius:16px;padding:32px 36px;display:flex;flex-direction:column;justify-content:center;background:var(--panel);\">\n      <p style=\"margin:0 0 10px;font-family:'Archivo';font-weight:700;font-size:var(--type-subtitle);color:var(--ink);\">Operational efficiency<\u002Fp>\n      <p style=\"margin:0;font-size:var(--type-body);line-height:1.4;color:var(--ink-2);\">Routine, predictable incidents resolve without a human — on-call effort shifts to the judgment calls that need it.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid var(--line);border-radius:16px;padding:32px 36px;display:flex;flex-direction:column;justify-content:center;background:var(--panel);\">\n      <p style=\"margin:0 0 10px;font-family:'Archivo';font-weight:700;font-size:var(--type-subtitle);color:var(--ink);\">Value creation<\u002Fp>\n      <p style=\"margin:0;font-size:var(--type-body);line-height:1.4;color:var(--ink-2);\">Engineering hours move from rework and firefighting into new capability — the platform funds future fit business models.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid var(--line);border-radius:16px;padding:32px 36px;display:flex;flex-direction:column;justify-content:center;background:var(--panel);\">\n      <p style=\"margin:0 0 10px;font-family:'Archivo';font-weight:700;font-size:var(--type-subtitle);color:var(--ink);\">Compliance, by design<\u002Fp>\n      <p style=\"margin:0;font-size:var(--type-body);line-height:1.4;color:var(--ink-2);\">Every agent decision, gate, and fix is stamped in the audit trail — governance is built into the pipeline, not bolted on.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══ SLIDE 4 — ARCHITECTURE AT A GLANCE ═══ -->\n<section data-label=\"Architecture\" data-screen-label=\"05 Architecture\" data-speaker-notes=\"Three layers: one orchestrator on top, a six-agent delivery pipeline in the middle, a four-agent monitoring and self-healing loop at the bottom. The critical property: all layers share one Context Store, so the production fix agent reads the original planning intent, known-good code, security constraints and SLA thresholds as first-class inputs.\" style=\"box-sizing:border-box;width:100%;height:100%;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);background:var(--bg);color:var(--ink);font-family:'Libre Franklin',sans-serif;display:flex;flex-direction:column;\">\n  <p style=\"margin:0 0 18px;font-size:26px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--indigo);\">Architecture at a Glance<\u002Fp>\n  <h2 style=\"margin:0;font-family:'Archivo',sans-serif;font-weight:700;font-size:48px;line-height:1.04;letter-spacing:-.02em;\">Three layers over one shared context<\u002Fh2>\n\n  <div style=\"flex:1;display:grid;grid-template-columns:250px 1fr;gap:22px;margin-top:34px;min-height:0;\">\n    <!-- Context spine -->\n    <div style=\"border:1.5px solid var(--teal-line);background:var(--teal-soft);border-radius:16px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px 22px;\">\n      <div style=\"width:56px;height:56px;border-radius:14px;background:var(--teal);display:flex;align-items:center;justify-content:center;margin-bottom:20px;\"><div style=\"width:26px;height:20px;border:3px solid #fff;border-radius:6px;\"><\u002Fdiv><\u002Fdiv>\n      <p style=\"margin:0 0 10px;font-family:'Archivo';font-weight:700;font-size:26px;color:var(--teal-ink);line-height:1.15;\">Shared Context Store<\u002Fp>\n      <p style=\"margin:0 0 18px;font-size:24px;line-height:1.4;color:var(--teal-ink);opacity:.9;\">Artifact registry · Agent memory · Full audit log<\u002Fp>\n      <p style=\"margin:0;font-size:24px;line-height:1.4;color:var(--ink-2);border-top:1px solid var(--teal-line);padding-top:16px;\">Every agent reads and writes here<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- Bands -->\n    <div style=\"display:flex;flex-direction:column;gap:16px;min-height:0;\">\n      <!-- Orchestration -->\n      <div style=\"border:1.5px solid var(--indigo);background:var(--indigo-soft);border-radius:14px;padding:16px 26px;display:flex;align-items:center;gap:26px;\">\n        <span style=\"font-size:24px;font-weight:700;letter-spacing:.12em;color:var(--indigo);writing-mode:horizontal-tb;\">ORCHESTRATION<\u002Fspan>\n        <span style=\"font-family:'Archivo';font-weight:700;font-size:28px;color:var(--indigo-ink);\">Master Orchestrator Agent<\u002Fspan>\n        <span style=\"margin-left:auto;font-size:24px;color:var(--ink-2);\">Routing · Quality gates · Retries &amp; rollback · Escalation<\u002Fspan>\n      <\u002Fdiv>\n\n      <!-- Pipeline -->\n      <div style=\"border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 20px 18px;\">\n        <p style=\"margin:0 0 12px;font-size:24px;font-weight:700;letter-spacing:.12em;color:var(--ink-3);\">DELIVERY PIPELINE<\u002Fp>\n        <div style=\"display:flex;align-items:stretch;gap:8px;\">\n          <div style=\"flex:1;background:var(--indigo-soft);border:1px solid var(--indigo-line);border-radius:11px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;\">\n            <span style=\"width:34px;height:34px;border-radius:999px;background:var(--indigo);color:#fff;font-family:'Archivo';font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center;\">1<\u002Fspan>\n            <span style=\"font-family:'Archivo';font-weight:600;font-size:24px;color:var(--indigo-ink);\">Plan<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"display:flex;align-items:center;color:var(--indigo-line);font-size:24px;\">›<\u002Fspan>\n          <div style=\"flex:1;background:var(--indigo-soft);border:1px solid var(--indigo-line);border-radius:11px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;\">\n            <span style=\"width:34px;height:34px;border-radius:999px;background:var(--indigo);color:#fff;font-family:'Archivo';font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center;\">2<\u002Fspan>\n            <span style=\"font-family:'Archivo';font-weight:600;font-size:24px;color:var(--indigo-ink);\">Build<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"display:flex;align-items:center;color:var(--indigo-line);font-size:24px;\">›<\u002Fspan>\n          <div style=\"flex:1;background:var(--indigo-soft);border:1px solid var(--indigo-line);border-radius:11px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;\">\n            <span style=\"width:34px;height:34px;border-radius:999px;background:var(--indigo);color:#fff;font-family:'Archivo';font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center;\">3<\u002Fspan>\n            <span style=\"font-family:'Archivo';font-weight:600;font-size:24px;color:var(--indigo-ink);\">Review<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"display:flex;align-items:center;color:var(--indigo-line);font-size:24px;\">›<\u002Fspan>\n          <div style=\"flex:1;background:var(--indigo-soft);border:1px solid var(--indigo-line);border-radius:11px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;\">\n            <span style=\"width:34px;height:34px;border-radius:999px;background:var(--indigo);color:#fff;font-family:'Archivo';font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center;\">4<\u002Fspan>\n            <span style=\"font-family:'Archivo';font-weight:600;font-size:24px;color:var(--indigo-ink);\">Test<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"display:flex;align-items:center;color:var(--indigo-line);font-size:24px;\">›<\u002Fspan>\n          <div style=\"flex:1;background:var(--indigo-soft);border:1px solid var(--indigo-line);border-radius:11px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;\">\n            <span style=\"width:34px;height:34px;border-radius:999px;background:var(--indigo);color:#fff;font-family:'Archivo';font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center;\">5<\u002Fspan>\n            <span style=\"font-family:'Archivo';font-weight:600;font-size:24px;color:var(--indigo-ink);\">Validate<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"display:flex;align-items:center;color:var(--indigo-line);font-size:24px;\">›<\u002Fspan>\n          <div style=\"flex:1;background:var(--indigo-soft);border:1px solid var(--indigo-line);border-radius:11px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;\">\n            <span style=\"width:34px;height:34px;border-radius:999px;background:var(--indigo);color:#fff;font-family:'Archivo';font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center;\">6<\u002Fspan>\n            <span style=\"font-family:'Archivo';font-weight:600;font-size:24px;color:var(--indigo-ink);\">Deploy<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- handoff -->\n      <div style=\"display:flex;align-items:center;justify-content:center;gap:12px;\">\n        <span style=\"font-size:24px;color:var(--ink-3);\">Deploy hands a live-traffic packet down to Monitoring<\u002Fspan>\n        <span style=\"color:var(--teal);font-size:24px;\">▼<\u002Fspan>\n      <\u002Fdiv>\n\n      <!-- Monitoring -->\n      <div style=\"border:1.5px solid var(--teal-line);background:var(--teal-soft);border-radius:14px;padding:14px 20px 18px;\">\n        <p style=\"margin:0 0 12px;font-size:24px;font-weight:700;letter-spacing:.1em;color:var(--teal-ink);\">MONITORING · PREDICTIVE INTELLIGENCE · SELF-HEALING<\u002Fp>\n        <div style=\"display:flex;align-items:stretch;gap:8px;\">\n          <div style=\"flex:1;background:#fff;border:1px solid var(--teal-line);border-radius:11px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;\">\n            <span style=\"width:34px;height:34px;border-radius:999px;background:var(--teal);color:#fff;font-family:'Archivo';font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center;\">7<\u002Fspan>\n            <span style=\"font-family:'Archivo';font-weight:600;font-size:24px;color:var(--teal-ink);\">Monitor<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"display:flex;align-items:center;color:var(--teal-line);font-size:24px;\">›<\u002Fspan>\n          <div style=\"flex:1;background:#fff;border:1px solid var(--teal-line);border-radius:11px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;\">\n            <span style=\"width:34px;height:34px;border-radius:999px;background:var(--teal);color:#fff;font-family:'Archivo';font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center;\">8<\u002Fspan>\n            <span style=\"font-family:'Archivo';font-weight:600;font-size:24px;color:var(--teal-ink);\">Predict<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"display:flex;align-items:center;color:var(--teal-line);font-size:24px;\">›<\u002Fspan>\n          <div style=\"flex:1;background:#fff;border:1px solid var(--teal-line);border-radius:11px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;\">\n            <span style=\"width:34px;height:34px;border-radius:999px;background:var(--teal);color:#fff;font-family:'Archivo';font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center;\">9<\u002Fspan>\n            <span style=\"font-family:'Archivo';font-weight:600;font-size:24px;color:var(--teal-ink);\">Fix<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"display:flex;align-items:center;color:var(--teal-line);font-size:24px;\">›<\u002Fspan>\n          <div style=\"flex:1;background:#fff;border:1px solid var(--teal-line);border-radius:11px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;\">\n            <span style=\"width:34px;height:34px;border-radius:999px;background:var(--teal);color:#fff;font-family:'Archivo';font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center;\">10<\u002Fspan>\n            <span style=\"font-family:'Archivo';font-weight:600;font-size:24px;color:var(--teal-ink);\">Self-heal<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1;background:var(--amber-soft);border:1px solid var(--amber-line);border-radius:11px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;\">\n            <span style=\"font-family:'Archivo';font-weight:600;font-size:24px;color:var(--amber);\">Human<\u002Fspan>\n            <span style=\"font-size:24px;color:var(--amber);\">escalation<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- feedback loop -->\n      <div style=\"border:1px dashed var(--teal-line);border-radius:12px;padding:10px 20px;display:flex;align-items:center;gap:12px;background:#fff;\">\n        <span style=\"color:var(--teal);font-size:24px;\">◄<\u002Fspan>\n        <span style=\"font-size:24px;color:var(--teal-ink);font-weight:600;\">Continuous feedback loop — production telemetry returns to the shared context store<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══ SLIDE 5 — ORCHESTRATION LAYER ═══ -->\n<section data-label=\"Orchestration\" data-screen-label=\"06 Orchestration\" data-speaker-notes=\"One Master Orchestrator, not peer-to-peer agents. Centralizing routing and context means every agent has a consistent versioned view of system state, and there's one place to enforce policy — like no production deploy without a passed validation gate.\" style=\"box-sizing:border-box;width:100%;height:100%;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);background:var(--bg);color:var(--ink);font-family:'Libre Franklin',sans-serif;display:flex;flex-direction:column;\">\n  <p style=\"margin:0 0 20px;font-size:26px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--indigo);\">The Orchestration Layer<\u002Fp>\n  <h2 style=\"margin:0;font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);line-height:1.04;letter-spacing:-.02em;\">One coordination brain<\u002Fh2>\n  <div style=\"flex:1;display:grid;grid-template-columns:440px 1fr;gap:44px;margin-top:48px;min-height:0;\">\n    <div style=\"border:1.5px solid var(--indigo);background:var(--indigo-soft);border-radius:20px;padding:44px 40px;display:flex;flex-direction:column;justify-content:center;\">\n      <div style=\"width:64px;height:64px;border-radius:16px;background:var(--indigo);display:flex;align-items:center;justify-content:center;margin-bottom:26px;\"><div style=\"width:26px;height:26px;border:3px solid #fff;border-radius:8px;\"><\u002Fdiv><\u002Fdiv>\n      <p style=\"margin:0 0 16px;font-family:'Archivo';font-weight:700;font-size:40px;line-height:1.08;color:var(--indigo-ink);\">Master Orchestrator Agent<\u002Fp>\n      <p style=\"margin:0;font-size:var(--type-body);line-height:1.45;color:var(--ink-2);\">Owns the Shared Context Store and routes every task between agents — one consistent, versioned view of system state.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;justify-content:center;gap:22px;\">\n      <div style=\"display:flex;gap:20px;align-items:flex-start;\"><span style=\"color:var(--indigo);font-family:'Archivo';font-weight:700;font-size:26px;flex:none;width:34px;\">01<\u002Fspan><p style=\"margin:0;font-size:var(--type-body);line-height:1.35;color:var(--ink);\"><b style=\"font-weight:700;\">Routes tasks<\u002Fb> between agents based on pipeline stage and outcome.<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:20px;align-items:flex-start;\"><span style=\"color:var(--indigo);font-family:'Archivo';font-weight:700;font-size:26px;flex:none;width:34px;\">02<\u002Fspan><p style=\"margin:0;font-size:var(--type-body);line-height:1.35;color:var(--ink);\"><b style=\"font-weight:700;\">Enforces quality gates<\u002Fb> — no handoff until outputs meet defined criteria.<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:20px;align-items:flex-start;\"><span style=\"color:var(--indigo);font-family:'Archivo';font-weight:700;font-size:26px;flex:none;width:34px;\">03<\u002Fspan><p style=\"margin:0;font-size:var(--type-body);line-height:1.35;color:var(--ink);\"><b style=\"font-weight:700;\">Manages retries and rollbacks<\u002Fb> when an output fails a downstream check.<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:20px;align-items:flex-start;\"><span style=\"color:var(--indigo);font-family:'Archivo';font-weight:700;font-size:26px;flex:none;width:34px;\">04<\u002Fspan><p style=\"margin:0;font-size:var(--type-body);line-height:1.35;color:var(--ink);\"><b style=\"font-weight:700;\">Receives external triggers<\u002Fb> — PR opened, deploy requested, production alert fired.<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:20px;align-items:flex-start;\"><span style=\"color:var(--indigo);font-family:'Archivo';font-weight:700;font-size:26px;flex:none;width:34px;\">05<\u002Fspan><p style=\"margin:0;font-size:var(--type-body);line-height:1.35;color:var(--ink);\"><b style=\"font-weight:700;\">Escalates to a human<\u002Fb> whenever agent confidence drops below threshold.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══ SLIDE 6 — DELIVERY PIPELINE ═══ -->\n<section data-label=\"Delivery Pipeline\" data-screen-label=\"07 Pipeline\" data-speaker-notes=\"Six agents, sequential, one per lifecycle stage. Each takes the prior agent's output, does its work, and produces artifacts that gate the next stage.\" style=\"box-sizing:border-box;width:100%;height:100%;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);background:var(--bg);color:var(--ink);font-family:'Libre Franklin',sans-serif;display:flex;flex-direction:column;\">\n  <p style=\"margin:0 0 20px;font-size:26px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--indigo);\">The Delivery Pipeline<\u002Fp>\n  <h2 style=\"margin:0;font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);line-height:1.04;letter-spacing:-.02em;\">Six agents, idea to production<\u002Fh2>\n  <div style=\"flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-top:48px;min-height:0;\">\n    <div style=\"border:1px solid var(--line);border-top:5px solid var(--indigo);border-radius:14px;padding:26px 22px;display:flex;flex-direction:column;background:#fff;\">\n      <span style=\"width:44px;height:44px;border-radius:999px;background:var(--indigo);color:#fff;font-family:'Archivo';font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;\">1<\u002Fspan>\n      <p style=\"margin:0 0 14px;font-family:'Archivo';font-weight:700;font-size:28px;color:var(--ink);\">Planning<\u002Fp>\n      <p style=\"margin:0 0 auto;font-size:var(--type-small);line-height:1.35;color:var(--ink-2);\">Breaks work into tasks, estimates complexity, flags risk areas.<\u002Fp>\n      <p style=\"margin:22px 0 0;font-size:24px;line-height:1.3;color:var(--indigo-ink);font-weight:600;border-top:1px solid var(--line);padding-top:14px;\">Feature spec · Risk register<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid var(--line);border-top:5px solid var(--indigo);border-radius:14px;padding:26px 22px;display:flex;flex-direction:column;background:#fff;\">\n      <span style=\"width:44px;height:44px;border-radius:999px;background:var(--indigo);color:#fff;font-family:'Archivo';font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;\">2<\u002Fspan>\n      <p style=\"margin:0 0 14px;font-family:'Archivo';font-weight:700;font-size:28px;color:var(--ink);\">Build<\u002Fp>\n      <p style=\"margin:0 0 auto;font-size:var(--type-small);line-height:1.35;color:var(--ink-2);\">Generates the implementation, writes inline tests, opens the PR.<\u002Fp>\n      <p style=\"margin:22px 0 0;font-size:24px;line-height:1.3;color:var(--indigo-ink);font-weight:600;border-top:1px solid var(--line);padding-top:14px;\">PR + diff · Test suite<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid var(--line);border-top:5px solid var(--indigo);border-radius:14px;padding:26px 22px;display:flex;flex-direction:column;background:#fff;\">\n      <span style=\"width:44px;height:44px;border-radius:999px;background:var(--indigo);color:#fff;font-family:'Archivo';font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;\">3<\u002Fspan>\n      <p style=\"margin:0 0 14px;font-family:'Archivo';font-weight:700;font-size:28px;color:var(--ink);\">Review<\u002Fp>\n      <p style=\"margin:0 0 auto;font-size:var(--type-small);line-height:1.35;color:var(--ink-2);\">Static analysis, security scan, logic review, refactor suggestions.<\u002Fp>\n      <p style=\"margin:22px 0 0;font-size:24px;line-height:1.3;color:var(--indigo-ink);font-weight:600;border-top:1px solid var(--line);padding-top:14px;\">SAST report · Decision<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid var(--line);border-top:5px solid var(--indigo);border-radius:14px;padding:26px 22px;display:flex;flex-direction:column;background:#fff;\">\n      <span style=\"width:44px;height:44px;border-radius:999px;background:var(--indigo);color:#fff;font-family:'Archivo';font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;\">4<\u002Fspan>\n      <p style=\"margin:0 0 14px;font-family:'Archivo';font-weight:700;font-size:28px;color:var(--ink);\">Testing<\u002Fp>\n      <p style=\"margin:0 0 auto;font-size:var(--type-small);line-height:1.35;color:var(--ink-2);\">Runs unit and integration suites, generates edge cases, checks contracts.<\u002Fp>\n      <p style=\"margin:22px 0 0;font-size:24px;line-height:1.3;color:var(--indigo-ink);font-weight:600;border-top:1px solid var(--line);padding-top:14px;\">Coverage · Gate signal<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid var(--line);border-top:5px solid var(--indigo);border-radius:14px;padding:26px 22px;display:flex;flex-direction:column;background:#fff;\">\n      <span style=\"width:44px;height:44px;border-radius:999px;background:var(--indigo);color:#fff;font-family:'Archivo';font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;\">5<\u002Fspan>\n      <p style=\"margin:0 0 14px;font-family:'Archivo';font-weight:700;font-size:28px;color:var(--ink);\">Validation<\u002Fp>\n      <p style=\"margin:0 0 auto;font-size:var(--type-small);line-height:1.35;color:var(--ink-2);\">Checks acceptance criteria and SLAs, runs load and chaos simulation.<\u002Fp>\n      <p style=\"margin:22px 0 0;font-size:24px;line-height:1.3;color:var(--indigo-ink);font-weight:600;border-top:1px solid var(--line);padding-top:14px;\">Certificate · Confidence<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid var(--line);border-top:5px solid var(--indigo);border-radius:14px;padding:26px 22px;display:flex;flex-direction:column;background:#fff;\">\n      <span style=\"width:44px;height:44px;border-radius:999px;background:var(--indigo);color:#fff;font-family:'Archivo';font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;\">6<\u002Fspan>\n      <p style=\"margin:0 0 14px;font-family:'Archivo';font-weight:700;font-size:28px;color:var(--ink);\">Deployment<\u002Fp>\n      <p style=\"margin:0 0 auto;font-size:var(--type-small);line-height:1.35;color:var(--ink-2);\">Blue/green or canary rollout, health polling, auto-rollback on failure.<\u002Fp>\n      <p style=\"margin:22px 0 0;font-size:24px;line-height:1.3;color:var(--indigo-ink);font-weight:600;border-top:1px solid var(--line);padding-top:14px;\">Deploy record · Handoff<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══ SLIDE — PIPELINE BOARD ═══ -->\n<section data-label=\"Pipeline Board\" data-screen-label=\"08 Pipeline Board\" data-speaker-notes=\"This is what the agent chain looks like in flight. Every story is a card that moves left to right through the same seven stages — planning, build, review, testing, validation, deployment, done — and each card shows the responsible agent's live status. Where an agent needs a human, the card surfaces it inline: FEAT-149 is waiting on infra capacity sign-off, FEAT-141 on a review re-scan. Managers get the rollup, developers get the detail, all from the same board.\" style=\"box-sizing:border-box;width:100%;height:100%;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);background:var(--panel);color:var(--ink);font-family:'Libre Franklin',sans-serif;display:flex;flex-direction:column;\">\n  <p style=\"margin:0 0 14px;font-size:26px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--indigo);\">Agent Status, Live<\u002Fp>\n  <h2 style=\"margin:0;font-family:'Archivo',sans-serif;font-weight:700;font-size:44px;line-height:1.04;letter-spacing:-.02em;\">The pipeline board<\u002Fh2>\n  <p style=\"margin:12px 0 0;font-size:24px;line-height:1.4;color:var(--ink-2);\">Stories tracked as they move through the same agent chain that builds and ships every change.<\u002Fp>\n\n  <div style=\"flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-top:26px;min-height:0;\">\n\n    <!-- PLANNING -->\n    <div style=\"display:flex;flex-direction:column;gap:12px;min-width:0;\">\n      <div style=\"background:#3B5BDB;border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:9px;\"><span style=\"width:26px;height:26px;border-radius:999px;background:rgba(255,255,255,.25);color:#fff;font-family:'Archivo';font-weight:700;
