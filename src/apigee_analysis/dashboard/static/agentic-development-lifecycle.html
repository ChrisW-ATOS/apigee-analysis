border:1.5px solid var(--teal-line);border-radius:13px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;box-shadow:0 4px 14px rgba(21,26,45,.06);\"><span style=\"width:38px;height:38px;border-radius:999px;background:var(--teal);color:#fff;font-family:'Archivo';font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center;\">10<\u002Fspan><span style=\"font-family:'Archivo';font-weight:700;font-size:25px;color:var(--teal-ink);\">Self-heal<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <!-- annotation -->\n    <div style=\"display:flex;flex-direction:column;justify-content:center;gap:26px;\">\n      <p style=\"margin:0;font-family:'Archivo';font-weight:700;font-size:34px;line-height:1.14;color:var(--ink);\">Every pass writes back to the same store<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:16px;\">\n        <div style=\"display:flex;gap:16px;align-items:flex-start;\"><span style=\"color:var(--teal);font-family:'Archivo';font-weight:700;font-size:26px;flex:none;\">+<\u002Fspan><p style=\"margin:0;font-size:var(--type-body);line-height:1.34;color:var(--ink-2);\">Fresh anomaly and failure patterns<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;gap:16px;align-items:flex-start;\"><span style=\"color:var(--teal);font-family:'Archivo';font-weight:700;font-size:26px;flex:none;\">+<\u002Fspan><p style=\"margin:0;font-size:var(--type-body);line-height:1.34;color:var(--ink-2);\">Fix outcomes — what worked, what didn't<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;gap:16px;align-items:flex-start;\"><span style=\"color:var(--teal);font-family:'Archivo';font-weight:700;font-size:26px;flex:none;\">+<\u002Fspan><p style=\"margin:0;font-size:var(--type-body);line-height:1.34;color:var(--ink-2);\">New known-good states and richer correlations<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:14px;\">\n        <span style=\"width:14px;height:14px;border-radius:999px;background:rgba(14,147,132,.35);flex:none;\"><\u002Fspan>\n        <span style=\"color:var(--teal-line);font-size:24px;\">▸<\u002Fspan>\n        <span style=\"width:22px;height:22px;border-radius:999px;background:rgba(14,147,132,.55);flex:none;\"><\u002Fspan>\n        <span style=\"color:var(--teal-line);font-size:24px;\">▸<\u002Fspan>\n        <span style=\"width:32px;height:32px;border-radius:999px;background:var(--teal);flex:none;\"><\u002Fspan>\n        <span style=\"font-size:24px;color:var(--teal-ink);font-weight:600;margin-left:6px;\">cycle 1 → 2 → 3 → n<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:var(--type-body);line-height:1.42;color:var(--ink);font-weight:500;border-top:1px solid var(--teal-line);padding-top:22px;\">The context the planning agent queries grows every cycle — so the system keeps getting smarter about its own codebase.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══ SLIDE 7 — CONTEXT COMPOUNDS (LINEAR) ═══ -->\n\n\n<!-- ═══ SLIDE 8 — LOOP GROWS CONTEXT (CYCLICAL) ═══ -->\n\n\n<!-- ═══ SLIDE 9 — MONITORING & SELF-HEALING ═══ -->\n<section data-label=\"Monitoring &amp; Self-Healing\" data-screen-label=\"12 Monitoring\" data-speaker-notes=\"This is the differentiated half. Four agents form a continuous production loop: monitor detects anomalies and stress-tests live; predict forecasts failures hours ahead; fix builds and stages a patch before the issue lands; self-heal deploys it, auto-deploying routine fixes and escalating novel ones.\" style=\"box-sizing:border-box;width:100%;height:100%;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);background:var(--panel);color:var(--ink);font-family:'Libre Franklin',sans-serif;display:flex;flex-direction:column;\">\n  <p style=\"margin:0 0 20px;font-size:26px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);\">Monitoring &amp; Self-Healing<\u002Fp>\n  <h2 style=\"margin:0;font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);line-height:1.04;letter-spacing:-.02em;\">The loop that runs after deploy<\u002Fh2>\n  <div style=\"flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:48px;min-height:0;\">\n    <div style=\"border:1px solid var(--teal-line);border-radius:16px;padding:32px 28px;display:flex;flex-direction:column;background:#fff;\">\n      <span style=\"width:48px;height:48px;border-radius:999px;background:var(--teal);color:#fff;font-family:'Archivo';font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center;margin-bottom:24px;\">7<\u002Fspan>\n      <p style=\"margin:0 0 14px;font-family:'Archivo';font-weight:700;font-size:30px;line-height:1.1;color:var(--teal-ink);\">Live Monitoring<\u002Fp>\n      <p style=\"margin:0;font-size:var(--type-body);line-height:1.4;color:var(--ink-2);\">Streams telemetry, separates real anomalies from seasonality, computes blast radius — and stress-tests live.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid var(--teal-line);border-radius:16px;padding:32px 28px;display:flex;flex-direction:column;background:#fff;\">\n      <span style=\"width:48px;height:48px;border-radius:999px;background:var(--teal);color:#fff;font-family:'Archivo';font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center;margin-bottom:24px;\">8<\u002Fspan>\n      <p style=\"margin:0 0 14px;font-family:'Archivo';font-weight:700;font-size:30px;line-height:1.1;color:var(--teal-ink);\">Predictive Intelligence<\u002Fp>\n      <p style=\"margin:0;font-size:var(--type-body);line-height:1.4;color:var(--ink-2);\">Projects failure 1–4 hours ahead, ranks cascade risk, and forms a root-cause hypothesis from deploy history.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid var(--teal-line);border-radius:16px;padding:32px 28px;display:flex;flex-direction:column;background:#fff;\">\n      <span style=\"width:48px;height:48px;border-radius:999px;background:var(--teal);color:#fff;font-family:'Archivo';font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center;margin-bottom:24px;\">9<\u002Fspan>\n      <p style=\"margin:0 0 14px;font-family:'Archivo';font-weight:700;font-size:30px;line-height:1.1;color:var(--teal-ink);\">Proactive Fix Dev<\u002Fp>\n      <p style=\"margin:0;font-size:var(--type-body);line-height:1.4;color:var(--ink-2);\">Generates and shadow-tests a targeted fix before the issue materialises, using full prior-agent context.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1.5px solid var(--teal);border-radius:16px;padding:32px 28px;display:flex;flex-direction:column;background:var(--teal-soft);\">\n      <span style=\"width:48px;height:48px;border-radius:999px;background:var(--teal);color:#fff;font-family:'Archivo';font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center;margin-bottom:24px;\">10<\u002Fspan>\n      <p style=\"margin:0 0 14px;font-family:'Archivo';font-weight:700;font-size:30px;line-height:1.1;color:var(--teal-ink);\">Auto-Deploy / Self-Heal<\u002Fp>\n      <p style=\"margin:0;font-size:var(--type-body);line-height:1.4;color:var(--ink-2);\">Auto-deploys routine fixes above a confidence threshold; escalates novel or high-blast-radius ones.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══ SLIDE 8 — LIVE STRESS TESTING ═══ -->\n<section data-label=\"Live Stress Testing\" data-screen-label=\"13 Stress Testing\" data-speaker-notes=\"The most novel piece. Instead of periodic synthetic load against staging, the monitoring agent continuously replays real production traffic patterns against a sandboxed shadow path, finding weaknesses at the pace traffic evolves. Its output becomes ready-made failure scenarios for the fix agent.\" style=\"box-sizing:border-box;width:100%;height:100%;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);background:var(--bg);color:var(--ink);font-family:'Libre Franklin',sans-serif;display:flex;flex-direction:column;\">\n  <p style=\"margin:0 0 20px;font-size:26px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);\">The Differentiator<\u002Fp>\n  <h2 style=\"margin:0;font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);line-height:1.04;letter-spacing:-.02em;\">Live stress testing, not periodic load tests<\u002Fh2>\n  <div style=\"flex:1;display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:48px;min-height:0;\">\n    <div style=\"border:1px solid var(--line);border-radius:18px;padding:44px;display:flex;flex-direction:column;background:var(--panel);\">\n      <p style=\"margin:0 0 22px;font-size:var(--type-small);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);\">Traditional load testing<\u002Fp>\n      <p style=\"margin:0 0 20px;font-family:'Archivo';font-weight:700;font-size:34px;line-height:1.12;color:var(--ink);\">Synthetic, periodic, pre-release<\u002Fp>\n      <p style=\"margin:auto 0 0;font-size:var(--type-body);line-height:1.45;color:var(--ink-2);\">Run made-up load against staging every so often — usually before a big release. Emerging weaknesses surface once per cycle, if at all.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1.5px solid var(--teal);border-radius:18px;padding:44px;display:flex;flex-direction:column;background:var(--teal-soft);\">\n      <p style=\"margin:0 0 22px;font-size:var(--type-small);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);\">This architecture<\u002Fp>\n      <p style=\"margin:0 0 20px;font-family:'Archivo';font-weight:700;font-size:34px;line-height:1.12;color:var(--teal-ink);\">Real traffic, continuous, live<\u002Fp>\n      <p style=\"margin:auto 0 0;font-size:var(--type-body);line-height:1.45;color:var(--ink-2);\">Continuously replays actual production patterns against a sandboxed shadow path — finding weaknesses at the pace traffic evolves.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:32px 0 0;font-size:var(--type-lead);line-height:1.4;color:var(--ink);font-weight:500;max-width:1580px;\">Its output feeds the fix agent as ready-made failure scenarios — closing the gap between \"we noticed a problem\" and \"we already tested the fix.\"<\u002Fp>\n<\u002Fsection>\n\n<!-- ═══ SLIDE 9 — HUMAN IN THE LOOP ═══ -->\n<section data-label=\"Human in the Loop\" data-screen-label=\"14 Human Loop\" data-speaker-notes=\"Autonomous where appropriate, not no-humans-ever. Routine, low-blast-radius fixes resolve without a person. Novel, high-blast-radius or low-confidence cases escalate with a full reasoning trace — the human can approve, reject, or modify. This preserves accountability while removing repetitive firefighting.\" style=\"box-sizing:border-box;width:100%;height:100%;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);background:var(--bg);color:var(--ink);font-family:'Libre Franklin',sans-serif;display:flex;flex-direction:column;\">\n  <p style=\"margin:0 0 20px;font-size:26px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);\">Governance<\u002Fp>\n  <h2 style=\"margin:0;font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);line-height:1.04;letter-spacing:-.02em;\">Where people still make the call<\u002Fh2>\n  <div style=\"flex:1;display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:48px;min-height:0;\">\n    <div style=\"border:1px solid var(--teal-line);border-radius:18px;padding:40px 44px;display:flex;flex-direction:column;background:var(--teal-soft);\">\n      <p style=\"margin:0 0 24px;font-family:'Archivo';font-weight:700;font-size:34px;color:var(--teal-ink);\">Auto-resolved<\u002Fp>\n      <p style=\"margin:0 0 24px;font-size:var(--type-small);color:var(--teal-ink);font-weight:500;\">Routine · well-understood · low blast radius<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:16px;\">\n        <p style=\"margin:0;font-size:var(--type-body);line-height:1.35;color:var(--ink-2);\">Credential and token rotation<\u002Fp>\n        <p style=\"margin:0;font-size:var(--type-body);line-height:1.35;color:var(--ink-2);\">Configuration drift reverts<\u002Fp>\n        <p style=\"margin:0;font-size:var(--type-body);line-height:1.35;color:var(--ink-2);\">Known rate-limit corrections<\u002Fp>\n        <p style=\"margin:0;font-size:var(--type-body);line-height:1.35;color:var(--ink-2);\">Anything matching a validated fix pattern<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1.5px solid var(--amber);border-radius:18px;padding:40px 44px;display:flex;flex-direction:column;background:var(--amber-soft);\">\n      <p style=\"margin:0 0 24px;font-family:'Archivo';font-weight:700;font-size:34px;color:var(--amber);\">Escalated to a human<\u002Fp>\n      <p style=\"margin:0 0 24px;font-size:var(--type-small);color:var(--amber);font-weight:500;\">Novel · high blast radius · low confidence<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:16px;\">\n        <p style=\"margin:0;font-size:var(--type-body);line-height:1.35;color:var(--ink-2);\">Full escalation packet: reasoning trace, confidence, proposed fix<\u002Fp>\n        <p style=\"margin:0;font-size:var(--type-body);line-height:1.35;color:var(--ink-2);\">Approve → immediate deploy<\u002Fp>\n        <p style=\"margin:0;font-size:var(--type-body);line-height:1.35;color:var(--ink-2);\">Reject → feeds back to the fix agent<\u002Fp>\n        <p style=\"margin:0;font-size:var(--type-body);line-height:1.35;color:var(--ink-2);\">Or modify the fix directly<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:32px 0 0;font-size:var(--type-lead);line-height:1.4;color:var(--ink);font-weight:500;max-width:1600px;\">The system handles the incidents on-call sees every week — and hands over the ones that need human judgment.<\u002Fp>\n<\u002Fsection>\n\n<!-- ═══ SLIDE 10 — CONTINUOUS FEEDBACK LOOP ═══ -->\n<section data-label=\"Feedback Loop\" data-screen-label=\"15 Feedback Loop\" data-speaker-notes=\"Not a one-way pipeline. Production telemetry closes back into the same context store the build agents wrote to — so every incident and fix makes the next planning cycle smarter, grounded in real production evidence rather than design-time assumptions.\" style=\"box-sizing:border-box;width:100%;height:100%;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);background:var(--panel);color:var(--ink);font-family:'Libre Franklin',sans-serif;display:flex;flex-direction:column;\">\n  <p style=\"margin:0 0 20px;font-size:26px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);\">The Continuous Feedback Loop<\u002Fp>\n  <h2 style=\"margin:0;font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);line-height:1.04;letter-spacing:-.02em;\">Production makes the next cycle smarter<\u002Fh2>\n  <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;\">\n    <div style=\"display:flex;align-items:center;justify-content:center;gap:14px;\">\n      <div style=\"flex:1;max-width:250px;background:#fff;border:1px solid var(--indigo-line);border-top:5px solid var(--indigo);border-radius:14px;padding:26px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;\">\n        <span style=\"width:40px;height:40px;border-radius:999px;background:var(--indigo);color:#fff;font-family:'Archivo';font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center;\">6<\u002Fspan>\n        <span style=\"font-family:'Archivo';font-weight:700;font-size:26px;color:var(--indigo-ink);\">Deploy<\u002Fspan>\n      <\u002Fdiv>\n      <span style=\"color:var(--teal);font-size:30px;\">→<\u002Fspan>\n      <div style=\"flex:1;max-width:250px;background:#fff;border:1px solid var(--teal-line);border-top:5px solid var(--teal);border-radius:14px;padding:26px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;\">\n        <span style=\"width:40px;height:40px;border-radius:999px;background:var(--teal);color:#fff;font-family:'Archivo';font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center;\">7<\u002Fspan>\n        <span style=\"font-family:'Archivo';font-weight:700;font-size:26px;color:var(--teal-ink);\">Monitor<\u002Fspan>\n      <\u002Fdiv>\n      <span style=\"color:var(--teal);font-size:30px;\">→<\u002Fspan>\n      <div style=\"flex:1;max-width:250px;background:#fff;border:1px solid var(--teal-line);border-top:5px solid var(--teal);border-radius:14px;padding:26px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;\">\n        <span style=\"width:40px;height:40px;border-radius:999px;background:var(--teal);color:#fff;font-family:'Archivo';font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center;\">8<\u002Fspan>\n        <span style=\"font-family:'Archivo';font-weight:700;font-size:26px;color:var(--teal-ink);\">Predict<\u002Fspan>\n      <\u002Fdiv>\n      <span style=\"color:var(--teal);font-size:30px;\">→<\u002Fspan>\n      <div style=\"flex:1;max-width:250px;background:#fff;border:1px solid var(--teal-line);border-top:5px solid var(--teal);border-radius:14px;padding:26px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;\">\n        <span style=\"width:40px;height:40px;border-radius:999px;background:var(--teal);color:#fff;font-family:'Archivo';font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center;\">9<\u002Fspan>\n        <span style=\"font-family:'Archivo';font-weight:700;font-size:26px;color:var(--teal-ink);\">Fix<\u002Fspan>\n      <\u002Fdiv>\n      <span style=\"color:var(--teal);font-size:30px;\">→<\u002Fspan>\n      <div style=\"flex:1;max-width:250px;background:#fff;border:1px solid var(--teal-line);border-top:5px solid var(--teal);border-radius:14px;padding:26px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;\">\n        <span style=\"width:40px;height:40px;border-radius:999px;background:var(--teal);color:#fff;font-family:'Archivo';font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center;\">10<\u002Fspan>\n        <span style=\"font-family:'Archivo';font-weight:700;font-size:26px;color:var(--teal-ink);\">Self-heal<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:16px;margin-top:26px;padding:0 60px;\">\n      <span style=\"color:var(--teal);font-size:26px;\">◄<\u002Fspan>\n      <div style=\"flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--teal-line),var(--teal-line) 10px,transparent 10px,transparent 20px);\"><\u002Fdiv>\n      <span style=\"font-size:24px;color:var(--teal-ink);font-weight:600;white-space:nowrap;\">returns to the Shared Context Store<\u002Fspan>\n      <div style=\"flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--teal-line),var(--teal-line) 10px,transparent 10px,transparent 20px);\"><\u002Fdiv>\n      <span style=\"color:var(--teal);font-size:26px;transform:scaleX(-1);\">◄<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font-size:var(--type-lead);line-height:1.4;color:var(--ink);font-weight:500;max-width:1620px;\">Every incident and every fix enriches the store the planning agent queries — so the next feature is planned against real production evidence, not design-time assumptions.<\u002Fp>\n<\u002Fsection>\n\n<!-- ═══ SLIDE — PLATFORM ARCHITECTURE ═══ -->\n<section data-label=\"Platform Architecture\" data-screen-label=\"16 Platform\" data-speaker-notes=\"How the platform is actually assembled. Four horizontal tiers: an identity tier anchored in the Microsoft tenant that resolves each user's role; the agent runtime with the orchestrator and both agent layers; the data plane holding the shared context store and telemetry; and a surfaces tier of role-scoped views plus the Teams interface. Identity governs who sees which surface, and everything reads and writes the context store.\" style=\"box-sizing:border-box;width:100%;height:100%;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);background:var(--bg);color:var(--ink);font-family:'Libre Franklin',sans-serif;display:flex;flex-direction:column;\">\n  <p style=\"margin:0 0 18px;font-size:26px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--violet);\">Platform Architecture<\u002Fp>\n  <h2 style=\"margin:0;font-family:'Archivo',sans-serif;font-weight:700;font-size:48px;line-height:1.04;letter-spacing:-.02em;\">Four tiers over the shared context<\u002Fh2>\n  <div style=\"flex:1;display:flex;flex-direction:column;gap:16px;margin-top:30px;min-height:0;\">\n\n    <!-- Identity tier -->\n    <div style=\"border:1.5px solid var(--violet);background:var(--violet-soft);border-radius:14px;padding:18px 26px;display:flex;align-items:center;gap:26px;\">\n      <div style=\"display:flex;flex-direction:column;gap:2px;flex:none;width:250px;\">\n        <span style=\"font-size:24px;font-weight:700;letter-spacing:.1em;color:var(--violet);\">IDENTITY<\u002Fspan>\n        <span style=\"font-family:'Archivo';font-weight:700;font-size:26px;color:var(--violet-ink);\">Microsoft Tenant<\u002Fspan>\n      <\u002Fdiv>\n      <span style=\"font-size:24px;color:var(--ink-2);line-height:1.35;\">Entra ID single sign-on · role resolved from tenant group membership · governs which surface each user can open<\u002Fspan>\n    <\u002Fdiv>\n\n    <!-- Agent runtime -->\n    <div style=\"border:1px solid var(--line);background:#fff;border-radius:14px;padding:16px 26px;flex:1;display:flex;flex-direction:column;min-height:0;\">\n      <span style=\"font-size:24px;font-weight:700;letter-spacing:.1em;color:var(--ink-3);margin-bottom:12px;\">AGENT RUNTIME<\u002Fspan>\n      <div style=\"flex:1;display:flex;gap:12px;min-height:0;\">\n        <div style=\"flex:none;width:250px;background:var(--indigo-soft);border:1px solid var(--indigo-line);border-radius:11px;padding:14px 18px;display:flex;flex-direction:column;justify-content:center;gap:4px;\">\n          <span style=\"font-family:'Archivo';font-weight:700;font-size:26px;color:var(--indigo-ink);\">Orchestrator<\u002Fspan>\n          <span style=\"font-size:24px;color:var(--ink-2);line-height:1.25;\">Routing · gates · policy<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"flex:1;background:var(--indigo-soft);border:1px solid var(--indigo-line);border-radius:11px;padding:14px 18px;display:flex;flex-direction:column;justify-content:center;gap:4px;\">\n          <span style=\"font-family:'Archivo';font-weight:700;font-size:26px;color:var(--indigo-ink);\">Delivery pipeline<\u002Fspan>\n          <span style=\"font-size:24px;color:var(--ink-2);line-height:1.25;\">Plan · Build · Review · Test · Validate · Deploy<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"flex:1;background:var(--teal-soft);border:1px solid var(--teal-line);border-radius:11px;padding:14px 18px;display:flex;flex-direction:column;justify-content:center;gap:4px;\">\n          <span style=\"font-family:'Archivo';font-weight:700;font-size:26px;color:var(--teal-ink);\">Monitoring &amp; self-healing<\u002Fspan>\n          <span style=\"font-size:24px;color:var(--ink-2);line-height:1.25;\">Monitor · Predict · Fix · Self-heal<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Data plane -->\n    <div style=\"border:1.5px solid var(--teal-line);background:var(--teal-soft);border-radius:14px;padding:16px 26px;display:flex;align-items:center;gap:26px;\">\n      <div style=\"display:flex;flex-direction:column;gap:2px;flex:none;width:250px;\">\n        <span style=\"font-size:24px;font-weight:700;letter-spacing:.1em;color:var(--teal-ink);\">DATA PLANE<\u002Fspan>\n        <span style=\"font-family:'Archivo';font-weight:700;font-size:26px;color:var(--teal-ink);\">Shared Context Store<\u002Fspan>\n      <\u002Fdiv>\n      <span style=\"font-size:24px;color:var(--ink-2);line-height:1.35;\">Artifact registry · agent memory · full audit log · time-series telemetry — every tier reads and writes here<\u002Fspan>\n    <\u002Fdiv>\n\n    <!-- Surfaces -->\n    <div style=\"border:1px solid var(--line);background:#fff;border-radius:14px;padding:16px 26px;display:flex;align-items:center;gap:26px;\">\n      <div style=\"display:flex;flex-direction:column;gap:2px;flex:none;width:250px;\">\n        <span style=\"font-size:24px;font-weight:700;letter-spacing:.1em;color:var(--ink-3);\">SURFACES<\u002Fspan>\n        <span style=\"font-family:'Archivo';font-weight:700;font-size:26px;color:var(--ink);\">Role-scoped &amp; Teams<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"flex:1;display:flex;gap:10px;flex-wrap:wrap;\">\n        <span style=\"font-size:24px;font-weight:600;color:var(--violet-ink);background:var(--violet-soft);border:1px solid var(--violet-line);border-radius:999px;padding:8px 18px;\">Manager overview<\u002Fspan>\n        <span style=\"font-size:24px;font-weight:600;color:var(--violet-ink);background:var(--violet-soft);border:1px solid var(--violet-line);border-radius:999px;padding:8px 18px;\">Monitoring console<\u002Fspan>\n        <span style=\"font-size:24px;font-weight:600;color:var(--violet-ink);background:var(--violet-soft);border:1px solid var(--violet-line);border-radius:999px;padding:8px 18px;\">Support workspace<\u002Fspan>\n        <span style=\"font-size:24px;font-weight:600;color:var(--violet-ink);background:var(--violet-soft);border:1px solid var(--violet-line);border-radius:999px;padding:8px 18px;\">Developer view<\u002Fspan>\n        <span style=\"font-size:24px;font-weight:600;color:var(--violet-ink);background:var(--violet-soft);border:1px solid var(--violet-line);border-radius:999px;padding:8px 18px;\">Microsoft Teams<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══ SLIDE — INTEGRATION: MICROSOFT TENANT / ROLES ═══ -->\n<section data-label=\"Role-Based Views\" data-screen-label=\"17 Roles\" data-speaker-notes=\"Integration design, part one. Users sign in with their existing Microsoft identity and their role comes pre-dictated from tenant group membership — no separate account setup. That role decides which side of the application they see: managers get a rollup, the monitoring team gets live telemetry, support gets the incident queue, developers get the code and agent traces. One platform, four scoped surfaces.\" style=\"box-sizing:border-box;width:100%;height:100%;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);background:var(--bg);color:var(--ink);font-family:'Libre Franklin',sans-serif;display:flex;flex-direction:column;\">\n  <p style=\"margin:0 0 18px;font-size:26px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--violet);\">Integration Design · Identity<\u002Fp>\n  <h2 style=\"margin:0;font-family:'Archivo',sans-serif;font-weight:700;font-size:48px;line-height:1.04;letter-spacing:-.02em;\">Your Microsoft role decides what you see<\u002Fh2>\n  <p style=\"margin:16px 0 0;font-size:var(--type-body);line-height:1.4;color:var(--ink-2);max-width:1560px;\">Single sign-on with Entra ID — role is pre-dictated by tenant group membership, so each user lands directly on the surface built for them. No separate accounts, no manual provisioning.<\u002Fp>\n  <div style=\"flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:36px;min-height:0;\">\n    <div style=\"border:1px solid var(--line);border-top:5px solid var(--violet);border-radius:16px;padding:30px 26px;display:flex;flex-direction:column;background:#fff;\">\n      <p style=\"margin:0 0 6px;font-size:24px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--violet);\">Manager<\u002Fp>\n      <p style=\"margin:0 0 16px;font-family:'Archivo';font-weight:700;font-size:30px;line-height:1.1;color:var(--ink);\">Managerial overview<\u002Fp>\n      <p style=\"margin:0 0 auto;font-size:24px;line-height:1.38;color:var(--ink-2);\">Delivery velocity, incident rollups, cost and SLA health — the state of the system at a glance.<\u002Fp>\n      <p style=\"margin:20px 0 0;font-size:24px;line-height:1.3;color:var(--violet-ink);font-weight:600;border-top:1px solid var(--line);padding-top:14px;\">Read-only · aggregated<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid var(--line);border-top:5px solid var(--teal);border-radius:16px;padding:30px 26px;display:flex;flex-direction:column;background:#fff;\">\n      <p style=\"margin:0 0 6px;font-size:24px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);\">Monitoring<\u002Fp>\n      <p style=\"margin:0 0 16px;font-family:'Archivo';font-weight:700;font-size:30px;line-height:1.1;color:var(--ink);\">Monitoring console<\u002Fp>\n      <p style=\"margin:0 0 auto;font-size:24px;line-height:1.38;color:var(--ink-2);\">Live telemetry, anomaly feed, cascade map and predictive forecasts across every proxy.<\u002Fp>\n      <p style=\"margin:20px 0 0;font-size:24px;line-height:1.3;color:var(--teal-ink);font-weight:600;border-top:1px solid var(--line);padding-top:14px;\">Live · operational<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid var(--line);border-top:5px solid var(--amber);border-radius:16px;padding:30px 26px;display:flex;flex-direction:column;background:#fff;\">\n      <p style=\"margin:0 0 6px;font-size:24px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);\">Support<\u002Fp>\n      <p style=\"margin:0 0 16px;font-family:'Archivo';font-weight:700;font-size:30px;line-height:1.1;color:var(--ink);\">Support workspace<\u002Fp>\n      <p style=\"margin:0 0 auto;font-size:24px;line-height:1.38;color:var(--ink-2);\">Incident queue, AI-generated briefs, escalation packets and one-click resolve actions.<\u002Fp>\n      <p style=\"margin:20px 0 0;font-size:24px;line-height:1.3;color:var(--amber);font-weight:600;border-top:1px solid var(--line);padding-top:14px;\">Act · escalate<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid var(--line);border-top:5px solid var(--indigo);border-radius:16px;padding:30px 26px;display:flex;flex-direction:column;background:#fff;\">\n      <p style=\"margin:0 0 6px;font-size:24px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--indigo);\">Developer<\u002Fp>\n      <p style=\"margin:0 0 16px;font-family:'Archivo';font-weight:700;font-size:30px;line-height:1.1;color:var(--ink);\">Developer view<\u002Fp>\n      <p style=\"margin:0 0 auto;font-size:24px;line-height:1.38;color:var(--ink-2);\">PRs, diffs, agent reasoning traces, test results and the full context trail per feature.<\u002Fp>\n      <p style=\"margin:20px 0 0;font-size:24px;line-height:1.3;color:var(--indigo-ink);font-weight:600;border-top:1px solid var(--line);padding-top:14px;\">Deep · code-level<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══ SLIDE — INTEGRATION: TEAMS ═══ -->\n<section data-label=\"Teams Integration\" data-screen-label=\"18 Teams\" data-speaker-notes=\"Integration design, part two. The agents live where the team already works. They post status into Teams channels — deploys, anomalies, predictions, fixes — and anyone can query them in natural language: what's the health of this API, why did that fix deploy, show me the escalation packet. Approvals for escalated fixes happen right in the Teams card, so the human-in-the-loop step never leaves the tool people already have open.\" style=\"box-sizing:border-box;width:100%;height:100%;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);background:var(--panel);color:var(--ink);font-family:'Libre Franklin',sans-serif;display:flex;flex-direction:column;\">\n  <p style=\"margin:0 0 18px;font-size:26px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--violet);\">Integration Design · Collaboration<\u002Fp>\n  <h2 style=\"margin:0;font-family:'Archivo',sans-serif;font-weight:700;font-size:48px;line-height:1.04;letter-spacing:-.02em;\">The agents work inside Microsoft Teams<\u002Fh2>\n  <div style=\"flex:1;display:grid;grid-template-columns:1.05fr 1fr;gap:44px;margin-top:36px;min-height:0;\">\n    <!-- Teams mock -->\n    <div style=\"border:1px solid var(--line);border-radius:18px;background:#fff;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 26px rgba(21,26,45,.07);\">\n      <div style=\"background:var(--violet);padding:16px 24px;display:flex;align-items:center;gap:14px;\">\n        <span style=\"width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Archivo';font-weight:700;font-size:24px;\">#<\u002Fspan>\n        <span style=\"font-family:'Archivo';font-weight:700;font-size:26px;color:#fff;\">api-platform / agents<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"flex:1;padding:24px;display:flex;flex-direction:column;gap:16px;min-height:0;\">\n        <div style=\"display:flex;gap:14px;align-items:flex-start;\">\n          <span style=\"width:44px;height:44px;border-radius:999px;background:var(--teal);color:#fff;font-family:'Archivo';font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center;flex:none;\">M<\u002Fspan>\n          <div style=\"background:var(--panel);border-radius:4px 14px 14px 14px;padding:14px 18px;\">\n            <p style=\"margin:0 0 6px;font-size:24px;color:var(--ink-3);font-weight:600;\">Monitoring Agent · now<\u002Fp>\n            <p style=\"margin:0;font-size:24px;line-height:1.35;color:var(--ink);\">⚠ Payments-API error rate trending up — <b>forecast breach in ~2h<\u002Fb>. Cascade risk: 3 downstream proxies.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:14px;align-items:flex-start;\">\n          <span style=\"width:44px;height:44px;border-radius:999px;background:var(--teal);color:#fff;font-family:'Archivo';font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center;flex:none;\">F<\u002Fspan>\n          <div style=\"background:var(--violet-soft);border:1px solid var(--violet-line);border-radius:4px 14px 14px 14px;padding:14px 18px;\">\n            <p style=\"margin:0 0 6px;font-size:24px;color:var(--violet-ink);font-weight:600;\">Fix Agent · needs approval<\u002Fp>\n            <p style=\"margin:0 0 12px;font-size:24px;line-height:1.35;color:var(--ink);\">Staged rate-limit correction. Shadow tests passed. Confidence 0.86.<\u002Fp>\n            <div style=\"display:flex;gap:10px;\"><span style=\"font-size:24px;font-weight:700;color:#fff;background:var(--violet);border-radius:8px;padding:8px 20px;\">Approve<\u002Fspan><span style=\"font-size:24px;font-weight:600;color:var(--violet-ink);background:#fff;border:1px solid var(--violet-line);border-radius:8px;padding:8px 20px;\">View diff<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:14px;align-items:flex-start;\">\n          <span style=\"width:44px;height:44px;border-radius:999px;background:var(--ink-3);color:#fff;font-family:'Archivo';font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center;flex:none;\">?<\u002Fspan>\n          <div style=\"background:var(--panel);border-radius:4px 14px 14px 14px;padding:14px 18px;\">\n            <p style=\"margin:0 0 6px;font-size:24px;color:var(--ink-3);font-weight:600;\">You<\u002Fp>\n            <p style=\"margin:0;font-size:24px;line-height:1.35;color:var(--ink);\">@agents what's the health of the Auth API right now?<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <!-- capabilities -->\n    <div style=\"display:flex;flex-direction:column;justify-content:center;gap:26px;\">\n      <div style=\"display:flex;gap:18px;align-items:flex-start;\">\n        <span style=\"width:12px;height:12px;border-radius:999px;background:var(--violet);flex:none;margin-top:14px;\"><\u002Fspan>\n        <div><p style=\"margin:0 0 6px;font-family:'Archivo';font-weight:700;font-size:30px;color:var(--ink);\">Agents post status<\u002Fp><p style=\"margin:0;font-size:var(--type-body);line-height:1.38;color:var(--ink-2);\">Deploys, anomalies, predictions and fixes stream into channels as they happen.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:18px;align-items:flex-start;\">\n        <span style=\"width:12px;height:12px;border-radius:999px;background:var(--violet);flex:none;margin-top:14px;\"><\u002Fspan>\n        <div><p style=\"margin:0 0 6px;font-family:'Archivo';font-weight:700;font-size:30px;color:var(--ink);\">Query in natural language<\u002Fp><p style=\"margin:0;font-size:var(--type-body);line-height:1.38;color:var(--ink-2);\">Ask any agent about API health, a deploy, or an incident — answered inline from the context store.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:18px;align-items:flex-start;\">\n        <span style=\"width:12px;height:12px;border-radius:999px;background:var(--violet);flex:none;margin-top:14px;\"><\u002Fspan>\n        <div><p style=\"margin:0 0 6px;font-family:'Archivo';font-weight:700;font-size:30px;color:var(--ink);\">Approve without leaving Teams<\u002Fp><p style=\"margin:0;font-size:var(--type-body);line-height:1.38;color:var(--ink-2);\">Escalated fixes arrive as actionable cards — approve, reject, or open the diff in one tap.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══ SLIDE 11 — REFERENCE IMPLEMENTATION ═══ -->\n<section data-label=\"Reference Implementation\" data-screen-label=\"19 Reference\" data-speaker-notes=\"Evidence the pattern is implementable today. This maps to a working system on MTN's API platform: Apigee analytics across 300-plus proxies and 15 operating companies, InfluxDB storage, STL plus Z-score and Isolation Forest anomaly detection, AR(1) forecasting, cross-correlation cascade prediction, a Streamlit dashboard, and Claude-generated incident briefs.\" style=\"box-sizing:border-box;width:100%;height:100%;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);background:var(--ink);color:#fff;font-family:'Libre Franklin',sans-serif;display:flex;flex-direction:column;\">\n  <p style=\"margin:0 0 20px;font-size:26px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#8FA6F5;\">Proof<\u002Fp>\n  <h2 style=\"margin:0;font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);line-height:1.04;letter-spacing:-.02em;color:#fff;\">A live reference implementation<\u002Fh2>\n  <p style=\"margin:22px 0 0;font-size:var(--type-body);line-height:1.4;color:#B7C0D8;max-width:1400px;\">Running today on MTN's API platform — not a speculative future-state diagram.<\u002Fp>\n  <div style=\"flex:1;display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:42px;min-height:0;\">\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px;align-content:center;\">\n      <div style=\"border:1px solid #2E3654;border-radius:16px;padding:30px;background:#1E2439;\">\n        <p style=\"margin:0 0 8px;font-family:'Archivo';font-weight:800;font-size:60px;line-height:1;color:#fff;\">300+<\u002Fp>\n        <p style=\"margin:0;font-size:var(--type-small);color:#B7C0D8;\">API proxies monitored<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #2E3654;border-radius:16px;padding:30px;background:#1E2439;\">\n        <p style=\"margin:0 0 8px;font-family:'Archivo';font-weight:800;font-size:60px;line-height:1;color:#fff;\">15<\u002Fp>\n        <p style=\"margin:0;font-size:var(--type-small);color:#B7C0D8;\">operating companies<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #2E3654;border-radius:16px;padding:30px;background:#1E2439;\">\n        <p style=\"margin:0 0 8px;font-family:'Archivo';font-weight:800;font-size:60px;line-height:1;color:#fff;\">1–4h<\u002Fp>\n        <p style=\"margin:0;font-size:var(--type-small);color:#B7C0D8;\">failure forecast horizon<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #2E3654;border-radius:16px;padding:30px;background:#1E2439;\">\n        <p style=\"margin:0 0 8px;font-family:'Archivo';font-weight:800;font-size:60px;line-height:1;color:#fff;\">Hourly<\u002Fp>\n        <p style=\"margin:0;font-size:var(--type-small);color:#B7C0D8;\">automated extraction<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;justify-content:center;gap:18px;\">\n      <div style=\"display:flex;gap:16px;align-items:baseline;\"><span style=\"color:#8FA6F5;font-weight:700;font-size:var(--type-small);width:150px;flex:none;\">Data &amp; storage<\u002Fspan><span style=\"font-size:var(--type-small);color:#E4E9F5;line-height:1.35;\">Apigee gateway analytics → InfluxDB time series<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:16px;align-items:baseline;\"><span style=\"color:#8FA6F5;font-weight:700;font-size:var(--type-small);width:150px;flex:none;\">Anomalies<\u002Fspan><span style=\"font-size:var(--type-small);color:#E4E9F5;line-height:1.35;\">STL + Z-score on residuals · Isolation Forest (multivariate)<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:16px;align-items:baseline;\"><span style=\"color:#8FA6F5;font-weight:700;font-size:var(--type-small);width:150px;flex:none;\">Forecasting<\u002Fspan><span style=\"font-size:var(--type-small);color:#E4E9F5;line-height:1.35;\">AR(1) model fitted on STL residuals<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:16px;align-items:baseline;\"><span style=\"color:#8FA6F5;font-weight:700;font-size:var(--type-small);width:150px;flex:none;\">Cascade<\u002Fspan><span style=\"font-size:var(--type-small);color:#E4E9F5;line-height:1.35;\">Behavioral cross-correlation on first differences<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:16px;align-items:baseline;\"><span style=\"color:#8FA6F5;font-weight:700;font-size:var(--type-small);width:150px;flex:none;\">Dashboard<\u002Fspan><span style=\"font-size:var(--type-small);color:#E4E9F5;line-height:1.35;\">Streamlit — Sankey cascade flow + correlation heatmap<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:16px;align-items:baseline;\"><span style=\"color:#8FA6F5;font-weight:700;font-size:var(--type-small);width:150px;flex:none;\">Incident briefs<\u002Fspan><span style=\"font-size:var(--type-small);color:#E4E9F5;line-height:1.35;\">Claude API — plain-English root cause &amp; recommended actions<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══ SLIDE 12 — WHERE TO START ═══ -->\n<section data-label=\"Where to Start\" data-screen-label=\"20 Where to Start\" data-speaker-notes=\"Sequence it by risk. Pilot the monitoring and predictive layer on existing production first — lowest risk, immediate value. Then extend to proactive fixes for a narrow, well-understood class like credential rotation. Introduce the full build/review/test/deploy chain for net-new work once the loop is proven.\" style=\"box-sizing:border-box;width:100%;height:100%;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);background:var(--bg);color:var(--ink);font-family:'Libre Franklin',sans-serif;display:flex;flex-direction:column;\">\n  <p style=\"margin:0 0 20px;font-size:26px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--indigo);\">Where to Start<\u002Fp>\n  <h2 style=\"margin:0;font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--type-title);line-height:1.04;letter-spacing:-.02em;\">A three-step rollout, sequenced by risk<\u002Fh2>\n  <div style=\"flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:48px;min-height:0;\">\n    <div style=\"border:1px solid var(--line);border-radius:18px;padding:40px 36px;display:flex;flex-direction:column;background:var(--panel);\">\n      <p style=\"margin:0 0 22px;font-family:'Archivo';font-weight:800;font-size:64px;line-height:1;color:var(--teal);\">01<\u002Fp>\n      <p style=\"margin:0 0 16px;font-family:'Archivo';font-weight:700;font-size:32px;line-height:1.12;color:var(--ink);\">Pilot monitoring + predictive<\u002Fp>\n      <p style=\"margin:0;font-size:var(--type-body);line-height:1.42;color:var(--ink-2);\">Add the loop to existing production systems. Lowest risk, immediate value — no changes to how you ship.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid var(--line);border-radius:18px;padding:40px 36px;display:flex;flex-direction:column;background:var(--panel);\">\n      <p style=\"margin:0 0 22px;font-family:'Archivo';font-weight:800;font-size:64px;line-height:1;color:var(--teal);\">02<\u002Fp>\n      <p style=\"margin:0 0 16px;font-family:'Archivo';font-weight:700;font-size:32px;line-height:1.12;color:var(--ink);\">Extend to proactive fixes<\u002Fp>\n      <p style=\"margin:0;font-size:var(--type-body);line-height:1.42;color:var(--ink-2);\">Automate a narrow, well-understood class first — credential rotation — before broadening scope.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid var(--line);border-radius:18px;padding:40px 36px;display:flex;flex-direction:column;background:var(--panel);\">\n      <p style=\"margin:0 0 22px;font-family:'Archivo';font-weight:800;font-size:64px;line-height:1;color:var(--indigo);\">03<\u002Fp>\n      <p style=\"margin:0 0 16px;font-family:'Archivo';font-weight:700;font-size:32px;line-height:1.12;color:var(--ink);\">Add the full build chain<\u002Fp>\n      <p style=\"margin:0;font-size:var(--type-body);line-height:1.42;color:var(--ink-2);\">Introduce build/review/test/deploy agents for net-new features once the feedback loop is proven.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:34px 0 0;font-size:var(--type-lead);line-height:1.4;color:var(--ink);font-weight:500;max-width:1640px;\">The goal is extracting value through orchestration — one shared context that lets the same intelligence build the system, test it, intelligently monitor for failure, and keep it running.<\u002Fp>\n<\u002Fsection>\n\n\n<\u002Fx-import>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;hideSidebar&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Presentation&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    // In the standalone export there is no host to post __omelette_presenting,\n    // so detect browser fullscreen (element fullscreen API or F11 window-fills-\n    // screen) and post the signal ourselves. Harmless in the editor: the check\n    // is false inside its iframe, and we only post on state *changes*.\n    this._fsState = false;\n    this._onFsChange = () => {\n      const fs = !!document.fullscreenElement ||\n        (window.innerWidth === screen.width && window.innerHeight === screen.height);\n      if (fs !== this._fsState) {\n        this._fsState = fs;\n        window.postMessage({ __omelette_presenting: fs }, '*');\n      }\n    };\n    document.addEventListener('fullscreenchange', this._onFsChange);\n    window.addEventListener('resize', this._onFsChange);\n    this._applyRail();\n    // deck-stage mounts asynchronously via x-import — retry briefly until present\n    this._railTimer = setInterval(() => {\n      if (document.querySelector('deck-stage')) {\n        this._applyRail();\n        clearInterval(this._railTimer);\n      }\n    }, 200);\n  }\n  componentWillUnmount() {\n    clearInterval(this._railTimer);\n    document.removeEventListener('fullscreenchange', this._onFsChange);\n    window.removeEventListener('resize', this._onFsChange);\n  }\n  componentDidUpdate() {\n    this._applyRail();\n  }\n  _applyRail() {\n    const stage = document.querySelector('deck-stage');\n    if (stage) stage.toggleAttribute('no-rail', !!(this.props.hideSidebar ?? false));\n  }\n  renderVals() {\n    return {};\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
